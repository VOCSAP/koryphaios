name: desktop-build

# Per-OS build for the claude-peers-desk Electron app. Its job is to catch
# native (node-pty) rebuild breakage and packaging-config regressions early,
# on every OS we ship to (win/mac/linux). The pure-module bun tests run first
# because they need no native toolchain; the native rebuild + electron-vite
# build follow and fail loudly if the OS toolchain is incomplete.

on:
  push:
    paths:
      - 'desktop/**'
      # The desktop no longer owns all the code its tests cover: the notify
      # channels, the broker and shared/ are exercised by the same matrix, so a
      # change there must trigger it too — otherwise a cross-platform break in
      # them lands unseen.
      - 'notify/**'
      - 'shared/**'
      - 'tests/**'
      - 'broker.ts'
      - '.github/workflows/desktop-build.yml'
  pull_request:
    paths:
      - 'desktop/**'
      - 'notify/**'
      - 'shared/**'
      - 'tests/**'
      - 'broker.ts'
      - '.github/workflows/desktop-build.yml'

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # Report each OS independently -- a Windows toolchain gap should not hide
      # a green macOS/Linux build (or vice versa).
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v6
        with:
          node-version: '20'

      # Root install: most of these suites still import with node builtins
      # only, but a renderer test harness (happy-dom + React) now also lives
      # under tests/desktop-*.test.ts, and its deps (@happy-dom/global-registrator,
      # react, react-dom, zustand) are declared in the root package.json. This
      # does not pull in node-pty or electron -- neither is a root dependency --
      # so the ABI rebuild below stays the only native-toolchain gate in this job.
      - name: Bun install (root)
        shell: bash
        run: bun install

      # Pure modules (desktop main-process helpers, the notify channels and
      # their wire format, the mobile shell's decision logic, and a
      # happy-dom/React renderer harness) import under bun -- no node-pty /
      # electron among the root deps, so no native toolchain is needed here.
      #
      # Card 0bbac537: this used to be an explicit `bun test <globs...>` line,
      # an allow-list that silently drops any new file matching none of its
      # patterns. scripts/partition-pure-tests.ts replaces it with a deny-list
      # (a new file runs by default; scripts/pure-module-partition.ts's
      # EXEMPTIONS table is what has to justify skipping one -- daemon-
      # spawning integration suites, same broker-/server- families as before)
      # AND fixes the process-global test pollution that made the previous
      # bare `bun test` unsafe here in the first place (GlobalRegistrator.
      # register() / bun's mock.module() both leak across files in a shared
      # process -- see that script's header for the measured chain). Single
      # call, single step, tests/desktop-ci-glob-coverage.test.ts's coverage
      # audit is anchored on this step keeping this exact name.
      - name: Bun tests (pure modules)
        shell: bash
        run: bun scripts/partition-pure-tests.ts

      # The mobile shell is TypeScript that nothing else type-checks: it is in
      # neither desktop tsconfig, and `bun build`/`bun test` only transpile. Its
      # whole point is sharing notify/ntfy-protocol.ts with the broker, so a
      # silent drift across that import is exactly what must not happen.
      - name: Typecheck the mobile shell
        shell: bash
        run: bunx tsc --noEmit -p desktop/mobile-shell/tsconfig.json

      - name: Install desktop deps
        working-directory: desktop
        # postinstall runs electron-rebuild but is tolerant (|| echo skipped);
        # the strict rebuild below is the real ABI gate.
        run: npm install

      # tsconfig.node.json / tsconfig.web.json (main + preload + renderer)
      # were never type-checked in CI: electron.vite.config.ts has no checker
      # plugin, so `electron-vite build` below does not catch a type error.
      # `tsc` only needs desktop/node_modules (just installed above), not the
      # rebuilt native node-pty binding, so this runs BEFORE the node-pty
      # rebuild and the build step -- the two slowest steps in this job -- so
      # a type error actually fails fast instead of waiting behind them.
      - name: Typecheck desktop (node + web)
        working-directory: desktop
        run: npm run typecheck

      # Rebuild node-pty against Electron's V8/ABI. Fails loudly if the runner
      # lacks the toolchain -- that is the breakage this workflow exists to
      # catch. Windows additionally needs the MSVC Spectre-mitigated libs,
      # because node-pty hardcodes SpectreMitigation in its binding.gyp
      # (see rules/electron.md / desktop/README.md "Native toolchain").
      - name: Rebuild node-pty (ABI gate)
        working-directory: desktop
        run: npm run rebuild

      - name: Build (electron-vite)
        working-directory: desktop
        run: npm run build
