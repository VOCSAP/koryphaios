name: desktop-build

# Per-OS build for the claude-peers-desk Electron app. Its job is to catch
# native (node-pty) rebuild breakage and packaging-config regressions early,
# on every OS we ship to (win/mac/linux). The pure-module bun tests run first
# because they need no native toolchain; the native rebuild + electron-vite
# build follow and fail loudly if the OS toolchain is incomplete.

on:
  push:
    paths:
      - 'desktop/**'
      # The desktop no longer owns all the code its tests cover: the notify
      # channels, the broker and shared/ are exercised by the same matrix, so a
      # change there must trigger it too — otherwise a cross-platform break in
      # them lands unseen.
      - 'notify/**'
      - 'shared/**'
      - 'tests/**'
      - 'broker.ts'
      # Card f4a3ed1e, reviewer 2026-08-28: server.ts and cli.ts are exercised
      # by tests this workflow now runs (server-*.test.ts,
      # mcp-roadmap-ack.test.ts spawns `bun server.ts` directly) but neither
      # file triggered this workflow at all -- a commit touching only
      # server.ts ran no job. scripts/** is what DECIDES which tests run in
      # both bun-tests steps; a change there changes CI behaviour with
      # nothing to trigger a run that would show it.
      - 'server.ts'
      - 'cli.ts'
      - 'scripts/**'
      - '.github/workflows/desktop-build.yml'
  pull_request:
    paths:
      - 'desktop/**'
      - 'notify/**'
      - 'shared/**'
      - 'tests/**'
      - 'broker.ts'
      - 'server.ts'
      - 'cli.ts'
      - 'scripts/**'
      - '.github/workflows/desktop-build.yml'

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # Report each OS independently -- a Windows toolchain gap should not hide
      # a green macOS/Linux build (or vice versa).
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v6

      # Pinned via .bun-version (repo root), not "latest": this same step ran
      # bun 1.3.14 at 09:36 and bun 1.4.0 at 14:25 on 2026-08-24 with no
      # commit in between -- a floating runtime silently changes what CI
      # executes. This matters here because bun's test-file execution order
      # is undocumented and NOT guaranteed by this pin (see card 0bbac537): a
      # floating version made that class of defect appear/disappear between
      # two runs of the SAME commit, which is what made a bisection
      # non-reproducible. Pinning only removes runtime drift as a variable;
      # it does not make ordering deterministic. commit-closure.yml and
      # desktop-release.yml read the SAME .bun-version file -- bump it there,
      # deliberately (card 8acf72be), never a literal here and not "latest".
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - uses: actions/setup-node@v6
        with:
          node-version: '20'

      # Root install: most of these suites still import with node builtins
      # only, but a renderer test harness (happy-dom + React) now also lives
      # under tests/desktop-*.test.ts, and its deps (@happy-dom/global-registrator,
      # react, react-dom, zustand) are declared in the root package.json. This
      # does not pull in node-pty or electron -- neither is a root dependency --
      # so the ABI rebuild below stays the only native-toolchain gate in this job.
      - name: Bun install (root)
        shell: bash
        run: bun install

      # Pure modules (desktop main-process helpers, the notify channels and
      # their wire format, the mobile shell's decision logic, and a
      # happy-dom/React renderer harness) import under bun -- no node-pty /
      # electron among the root deps, so no native toolchain is needed here.
      #
      # Card 0bbac537: this used to be an explicit `bun test <globs...>` line,
      # an allow-list that silently drops any new file matching none of its
      # patterns. scripts/partition-pure-tests.ts replaces it with a deny-list
      # (a new file runs by default; scripts/pure-module-partition.ts's
      # EXEMPTIONS table is what has to justify skipping one -- daemon-
      # spawning integration suites, same broker-/server- families as before)
      # AND fixes the process-global test pollution that made the previous
      # bare `bun test` unsafe here in the first place (GlobalRegistrator.
      # register() / bun's mock.module() both leak across files in a shared
      # process -- see that script's header for the measured chain). Single
      # call, single step, tests/desktop-ci-glob-coverage.test.ts's coverage
      # audit is anchored on this step keeping this exact name.
      - name: Bun tests (pure modules)
        shell: bash
        run: bun scripts/partition-pure-tests.ts

      # The mobile shell is TypeScript that nothing else type-checks: it is in
      # neither desktop tsconfig, and `bun build`/`bun test` only transpile. Its
      # whole point is sharing notify/ntfy-protocol.ts with the broker, so a
      # silent drift across that import is exactly what must not happen.
      - name: Typecheck the mobile shell
        shell: bash
        run: bunx tsc --noEmit -p desktop/mobile-shell/tsconfig.json

      - name: Install desktop deps
        working-directory: desktop
        # postinstall runs electron-rebuild but is tolerant (|| echo skipped);
        # the strict rebuild below is the real ABI gate.
        run: npm install

      # tsconfig.node.json / tsconfig.web.json (main + preload + renderer)
      # were never type-checked in CI: electron.vite.config.ts has no checker
      # plugin, so `electron-vite build` below does not catch a type error.
      # `tsc` only needs desktop/node_modules (just installed above), not the
      # rebuilt native node-pty binding, so this runs BEFORE the node-pty
      # rebuild and the build step -- the two slowest steps in this job -- so
      # a type error actually fails fast instead of waiting behind them.
      - name: Typecheck desktop (node + web)
        working-directory: desktop
        run: npm run typecheck

      # Rebuild node-pty against Electron's V8/ABI. Fails loudly if the runner
      # lacks the toolchain -- that is the breakage this workflow exists to
      # catch. Windows additionally needs the MSVC Spectre-mitigated libs,
      # because node-pty hardcodes SpectreMitigation in its binding.gyp
      # (see rules/electron.md / desktop/README.md "Native toolchain").
      - name: Rebuild node-pty (ABI gate)
        working-directory: desktop
        run: npm run rebuild

      - name: Build (electron-vite)
        working-directory: desktop
        run: npm run build

      # Card f4a3ed1e: the complement of the "Bun tests (pure modules)" step
      # above. 52+ tests/*.test.ts files (broker-/server- prefixes,
      # approval-hook.test.ts, mcp-roadmap-ack.test.ts) spawn a daemon and
      # bind a port each, so they are exempted from that step's shared-
      # process batch on purpose (scripts/pure-module-partition.ts's
      # EXEMPTIONS table) -- but until this step existed, nothing else
      # played them either: they ran in NO CI job at all. Own step, own time
      # budget, deliberately not merged into the pure-module batch (mixing
      # daemon-spawning integration suites into that shared-process run
      # would reintroduce port/timing coupling the pure-module partition
      # exists to avoid).
      #
      # Placed LAST, reviewer 2026-08-28: these 52+ files have never run on
      # a Linux/macOS CI runner, so a first red here is expected and must
      # not swallow the packaging signal this workflow exists to protect --
      # every OS toolchain gate above (typecheck, node-pty ABI rebuild,
      # electron-vite build) reports on its own merits first. Still
      # BLOCKING (no continue-on-error): a decorative step here would be the
      # exact fail-open shape this card exists to close, just moved one
      # level up.
      #
      # scripts/pure-module-partition.ts's EXEMPTIONS reasons name this step
      # by this exact string; tests/desktop-ci-glob-coverage.test.ts's
      # auditExemptionLocations verifies that claim against this file's real
      # text (anchored to end-of-line, so a rename to a superstring of this
      # name -- e.g. adding an `if:` and " [linux only]" in the same edit --
      # is caught as a dangling claim, not silently matched).
      #
      # timeout-minutes, paired with the `--timeout 30000` that
      # scripts/partition-integration-tests.ts now passes to bun. Until that
      # flag existed, bun's 5000 ms default WAS the de-facto brake on this
      # step: nothing else bounded it, `grep -c timeout-minutes` over this
      # file returned 0, so a hang was capped only by GitHub's 6 h job
      # default. Raising the per-test budget removes that brake, hence this
      # one.
      #
      # ON THE STEP, not on the job: this is the only step whose brake is
      # being loosened. A job-level guard would have to cover the whole
      # windows job (10 min 54 s measured on run 33176332938, of which
      # "Install desktop deps" alone is 2 min 47 s), so its value would be
      # dominated by steps this change does not touch, and a trip would not
      # say which one ran away. `fail-fast: false` above already isolates the
      # three OSes from each other.
      #
      # 25 and not 15: the step measures 5 min 05 s on its slowest OS
      # (windows, same run), and the realistic worst case is ~23 min -- the
      # 35 files that start a broker in a hook each burning the new 30 s
      # budget (17 min 30 s) on top of the nominal 5 min. 25 sits just ABOVE
      # that so a fully degraded run still COMPLETES and names its 35
      # failures, instead of being cut into a single anonymous "action timed
      # out" with no recap line; and it still turns the absolute worst case
      # (every one of the ~497 tests hanging, 4 h) into 25 minutes.
      - name: Bun tests (integration)
        shell: bash
        timeout-minutes: 25
        run: bun scripts/partition-integration-tests.ts
