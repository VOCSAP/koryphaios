<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Koryphaios</title>
    <style>
      /* The shell's own chrome only. Companion mode navigates away to the
         Deck-served renderer, which brings its own stylesheet — nothing here
         must try to look like the Deck, or the two would drift. */
      :root {
        --bg: #181818;
        --bg-2: #202020;
        --fg: #e4e4e4;
        --fg-dim: #9a9a9a;
        --border: #333;
        --accent: #4488ff;
        --danger: #d9534f;
      }
      @media (prefers-color-scheme: light) {
        :root {
          --bg: #f4f4f4;
          --bg-2: #fff;
          --fg: #1a1a1a;
          --fg-dim: #666;
          --border: #d8d8d8;
        }
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: var(--bg);
        color: var(--fg);
        font-family: system-ui, sans-serif;
      }
      main {
        padding: 16px 16px calc(16px + env(safe-area-inset-bottom));
        max-width: 640px;
        margin: 0 auto;
      }
      h1 {
        font-size: 18px;
        margin: 8px 0 12px;
      }
      #tabs {
        display: flex;
        gap: 6px;
        margin-bottom: 14px;
      }
      .tab {
        flex: 1;
        padding: 10px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--bg-2);
        color: var(--fg-dim);
        font-size: 15px;
      }
      .tab.is-active {
        color: var(--fg);
        border-color: var(--accent);
      }
      button {
        min-height: 44px; /* a thumb target, not a mouse target */
        padding: 10px 14px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--bg-2);
        color: var(--fg);
        font-size: 15px;
      }
      button.primary {
        background: var(--accent);
        border-color: var(--accent);
        color: #fff;
        width: 100%;
      }
      button.danger {
        color: var(--danger);
        border-color: var(--danger);
      }
      button:disabled {
        opacity: 0.4;
      }
      .list {
        list-style: none;
        padding: 0;
        margin: 14px 0 0;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .row {
        display: flex;
        gap: 8px;
        align-items: center;
      }
      .row + .row {
        margin-top: 8px;
      }
      .grow {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
        gap: 2px;
      }
      .card,
      li.row {
        padding: 12px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--bg-2);
      }
      li.row.is-selected {
        border-color: var(--accent);
      }
      small {
        color: var(--fg-dim);
        font-size: 12px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      pre.body {
        margin: 8px 0;
        padding: 8px;
        border-radius: 6px;
        background: var(--bg);
        font-size: 13px;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }
      input {
        min-height: 44px;
        padding: 8px 10px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--bg);
        color: var(--fg);
        font-size: 15px;
      }
      .hint,
      .notice {
        color: var(--fg-dim);
        font-size: 13px;
        line-height: 1.5;
      }
      .notice {
        padding: 10px;
        border: 1px solid var(--border);
        border-radius: 8px;
        color: var(--fg);
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Koryphaios</h1>
      <div id="tabs"></div>
      <div id="view"></div>
    </main>
    <!-- Built from src/ by `npm run build` (bun). www/dist is gitignored: the
         bundle is a build artefact, produced on the machine that has the
         Android tooling. -->
    <script type="module" src="./dist/app.js"></script>
  </body>
</html>
