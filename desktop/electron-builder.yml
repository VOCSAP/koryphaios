appId: com.vocsap.koryphaios
productName: Koryphaios
# Space-free binary name (convenient on PATH); productName stays the display
# name (window title, Start-menu shortcut, installer filename).
executableName: koryphaios
directories:
  output: dist
  buildResources: build
files:
  - out/**/*
  - package.json
# node-pty ships a native .node binary that must stay outside the asar archive.
asarUnpack:
  - node_modules/node-pty/**
# Locale files are read at runtime from process.resourcesPath/locales when
# packaged (see ipc.ts buildI18n). Ship them as resources so `fr` resolves
# instead of silently falling back to the embedded English base (debt D3).
extraResources:
  - from: locales
    to: locales
  # Reference documentation (docs/): read at runtime by the help assistant and
  # the supervisor (resolveDocsDir resolves process.resourcesPath/docs when
  # packaged, the app dir in dev). Without this a packaged app silently loses
  # the docs grounding.
  - from: docs
    to: docs
  # Embedded Claude Code plugin: the SessionStart back-channel hook, the approval
  # hook, the deck-control and demo-browser MCP bridges, and the roadmap-card skill
  # with its roadmap-scribe agent (card a79c7696 volet 3). Dropping this directory
  # costs all four, not just the hook. Loaded into
  # every Deck session via --plugin-dir (resolved LIVE from process.resourcesPath
  # when packaged, see index.ts getDeckPluginDir -- re-checked at every spawn, not
  # cached at boot, card d02c8e96). The hook bundle (.mjs) is produced by
  # `npm run build:hook`, which runs before packaging via the build/package scripts.
  # tests/desktop-electron-builder-resources.test.ts reads this extraResources
  # list to guard against a packaging run silently dropping an entry.
  - from: deck-plugin
    to: deck-plugin
  # Sandbox image recipe: the Docker view builds it from
  # process.resourcesPath/sandbox when packaged (index.ts imageContextDir).
  # Without this the packaged app can detect an engine but never build.
  - from: resources/sandbox
    to: sandbox
win:
  # Pre-built, pre-stacked .ico (512/256/128/64 with plate, 32/16 without --
  # see build/icon-sources/ and build/make-icns.py header for the tier rule).
  # Points at the file, not build/, so electron-builder's own directory-icon
  # convention (which would pick only the largest PNG and re-derive the rest)
  # never kicks in. File already carries the .ico extension so app-builder-lib
  # returns it as-is (skips conversion) -- see app-builder-lib/out/util/
  # iconConverter.js doConvertIcon, single-file/target-extension branch.
  icon: build/icon.ico
  # NSIS installer plus a portable .zip (run anywhere, no install).
  target:
    - nsis
    - zip
mac:
  # Pre-built .icns (same per-tier stacking, hand-rolled by build/make-icns.py
  # since ImageMagick on this box can write an .icns but silently keeps only
  # the first frame -- see that script's header for the measured proof).
  # Same skip-conversion mechanism as win.icon above.
  icon: build/icon.icns
  target:
    - dmg
    - zip
  category: public.app-category.developer-tools
linux:
  # Pre-built per-tier PNG set (build/icons/NxN.png) instead of a single
  # master PNG, for the same tier-rule reason.
  icon: build/icons
  # AppImage is already a single portable binary.
  target:
    - AppImage
  category: Development
