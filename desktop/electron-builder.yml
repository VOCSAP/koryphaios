appId: com.vocsap.koryphaios
productName: Koryphaios
# Space-free binary name (convenient on PATH); productName stays the display
# name (window title, Start-menu shortcut, installer filename).
executableName: koryphaios
directories:
  output: dist
  buildResources: build
files:
  - out/**/*
  - package.json
# node-pty ships a native .node binary that must stay outside the asar archive.
asarUnpack:
  - node_modules/node-pty/**
# Read from the resources path when packaged; without them `fr` falls back to English.
extraResources:
  - from: locales
    to: locales
  # Help assistant and supervisor grounding.
  - from: docs
    to: docs
  # Every Deck session loads this plugin (hooks, MCP bridges, CLI, skills).
  - from: deck-plugin
    to: deck-plugin
  - from: deck-lead-plugin
    to: deck-lead-plugin
  # Sandbox image recipe the Docker view builds from.
  - from: resources/sandbox
    to: sandbox
  # Avatar Tray icon PNGs, loaded by path (nativeImage has no SVG decoder).
  - from: resources/avatar-tray
    to: avatar-tray
win:
  # A file, not a directory: a directory would be downscaled from its largest PNG.
  icon: build/icon.ico
  target:
    - nsis
    - zip
mac:
  # Hand-rolled: ImageMagick writes an .icns that keeps only its first frame.
  icon: build/icon.icns
  target:
    - dmg
    - zip
  category: public.app-category.developer-tools
linux:
  # Per-size PNG set: Linux keeps every NxN.png without downscaling.
  icon: build/icons
  # AppImage is already a single portable binary.
  target:
    - AppImage
  category: Development
